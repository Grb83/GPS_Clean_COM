
[LogMessage]
;default: WriteMessage=No
WriteMessage=Yes
;default: LogFileName=[name_exe_module].log
;LogFileName=MyLogFileName.log


;                Section below defines port, flow settings
; port    - COM# (default 1 --> COM1)
; baud    - COM speed (300, 600, 1200, 2400, 4800, 9600 <-- default, 19200, 38400, 57600, 115200)
; parity  - COM parity (0 - non <-- default; 1 - even; 2 - odd)
; data    - COM data bits (7 or 8 <-- default)
; stop    - COM stop bits (1 <-- default or 2)
; t_out   - polling timeout, ms (1000 <-- default)

[PortDefs]

port = 7
baud = 4800
;t_out = 3000


;                  Section below defines GPS data processing
; DGPS_fix      - process differential (=2) GPS fix (No <-- default)
; Estimated     - process Estimated (=6) GPS quality indication as valid (No <-- default)
; RMC_date      - process date from RMC sentence (Yes <-- default)
; min_SatInUse  - minimum number of satellites in use for time lock (1..12; 3 <-- default)
; max_TimeGaps  - maximum number of 200-ms time slices to wait for GGA or RMC sentence (1..299; 10 <-- default)
; min_Mistiming - minimum mistiming between GPS and system to correct, sec (3..65534; 5 <-- default)
; max_ToutGaps  - maximum number of 200-ms time slices to wait for valid GGA sentence before "disable execute" (10..10000; 300 <-- default)
; packetLog     - log GPS packets (No <-- default)

[GPS]

;DGPS_fix = Yes
;Estimated = Yes
;RMC_date = No
;min_SatInUse = 5
;max_TimeGaps = 20
;max_ToutGaps = 3000
;packetLog = Yes